[project]
name = "craggy-charts"
version = "1.0.0"
description = "Tile charts for Jupyter, Streamlit and static HTML: beautiful by default, animated as data changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["anywidget>=0.9", "traitlets>=5"]
keywords = ["charts", "visualization", "jupyter", "anywidget", "streamlit"]
classifiers = [
  "Framework :: Jupyter",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/craggy-io/craggy-charts"

[project.optional-dependencies]
streamlit = ["streamlit>=1.30"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craggy_charts"]
artifacts = ["craggy_charts/static/*.js"]

[tool.hatch.build.targets.sdist]
include = ["craggy_charts", "README.md", "LICENSE", "hatch_build.py"]
artifacts = ["craggy_charts/static/*.js"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "pandas>=2", "polars>=1", "numpy>=1.26", "streamlit>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
