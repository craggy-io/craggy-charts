<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0b1216}#w{width:500px}</style>
<div id="w"></div>
<script type="module">
// Drives the Python package's anywidget front end with a minimal stand-in for the anywidget model.
import widget from '../../../python/craggy_charts/static/widget.js';
const state = { options: { type: 'bar', data: [{ m: 'Jan', v: 3 }, { m: 'Feb', v: 5 }] }, height: 240 };
const listeners = {};
const model = {
  get: k => state[k],
  set: (k, v) => { state[k] = v; (listeners['change:' + k] || []).forEach(f => f()); },
  on: (e, f) => (listeners[e] ||= []).push(f),
  off: (e, f) => { listeners[e] = (listeners[e] || []).filter(g => g !== f); },
  send: m => window.sent.push(m),
  emit: (e, m) => (listeners[e] || []).forEach(f => f(m)),
};
window.sent = [];
window.model = model;
window.cleanup = widget.render({ model, el: document.getElementById('w') });
document.body.dataset.ready = '1';
</script>
